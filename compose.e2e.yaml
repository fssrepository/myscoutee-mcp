name: myscoutee-mcp-e2e

services:
  mcp:
    extends:
      file: compose.common.yaml
      service: mcp
    image: ${MCP_E2E_IMAGE:-myscoutee-mcp:1.6.0-e2e}
    restart: "no"
    environment:
      MYSCOUTEE_API_BASE_URL: ${MYSCOUTEE_E2E_API_BASE_URL:?Set the e2e API base URL ending in /api}
    ports:
      - "127.0.0.1:${MCP_E2E_PORT:-18091}:8080"
