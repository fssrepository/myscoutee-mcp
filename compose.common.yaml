# Shared MCP service configuration; select compose.dev.yaml or compose.prod.yaml.
services:
  mcp:
    build: .
    environment:
      MYSCOUTEE_MCP_TRANSPORT: http
      MYSCOUTEE_MCP_LISTEN: 0.0.0.0:8080
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
