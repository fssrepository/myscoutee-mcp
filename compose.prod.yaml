name: myscoutee-mcp-prod

services:
  mcp:
    extends:
      file: compose.common.yaml
      service: mcp
    image: ${MCP_IMAGE:-myscoutee-mcp:1.5.0-prod}
    restart: unless-stopped
    environment:
      MYSCOUTEE_API_BASE_URL: ${MYSCOUTEE_API_BASE_URL:?Set the prod API base URL ending in /api}
    ports:
      - "127.0.0.1:${MCP_PROD_PORT:-8091}:8080"
